plugins { id 'com.android.application' }

def signingFile = file(System.getenv('MOMOWALA_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.config/momowala-android/signing.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'com.cartlyft.momowala'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cartlyft.momowala'
        minSdk 24
        targetSdk 35
        testInstrumentationRunner project.hasProperty('flowTests') ? 'com.cartlyft.momowala.TabFlowTest' : 'com.cartlyft.momowala.PrintRoutingTest'
        versionCode 11
        versionName '1.6.3'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('requireReleaseSigning') {
    doLast { if (!signingFile.exists()) throw new GradleException('Release signing is missing. See docs/android-app.md.') }
}
tasks.configureEach { if (name == 'validateSigningRelease') dependsOn 'requireReleaseSigning' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.firebase:firebase-messaging:26.0.0'
}
// Firebase public Android configuration is fetched after project provisioning.
def firebaseConfig = file('google-services.json')
if (firebaseConfig.exists()) {
    def config = new groovy.json.JsonSlurper().parse(firebaseConfig)
    def client = config.client.find { it.client_info.android_client_info.package_name == 'com.cartlyft.momowala' }
    if (client == null) throw new GradleException('Firebase config package does not match Cartlyft')
    android.defaultConfig {
        resValue 'string', 'google_app_id', client.client_info.mobilesdk_app_id
        resValue 'string', 'gcm_defaultSenderId', config.project_info.project_number
        resValue 'string', 'google_api_key', client.api_key[0].current_key
        resValue 'string', 'project_id', config.project_info.project_id
    }
}
