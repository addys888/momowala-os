plugins { id 'com.android.application' }

def signingFile = file(System.getenv('MOMOWALA_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.config/momowala-android/signing.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'com.cartlyft.momowala'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cartlyft.momowala'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('requireReleaseSigning') {
    doLast { if (!signingFile.exists()) throw new GradleException('Release signing is missing. See docs/android-app.md.') }
}
tasks.configureEach { if (name == 'validateSigningRelease') dependsOn 'requireReleaseSigning' }
